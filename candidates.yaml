# candidates.yaml
# Project-specific benchmark plan for the `panning` repository.
#
# Goal:
#   Evaluate whether panning-shot blur can be restored into a sharp image.
#   Split experiments into:
#     1) known_kernel deblurring
#     2) blind deblurring
#   Evaluate using an existing homography-warp PSNR pipeline:
#     sharp_ref -> homography warp -> overlap mask -> PSNR on overlap only.
#
# Intended location:
#   panning/candidates.yaml
#
# Assumptions:
#   - This file is used from the root of the existing `panning` repo.
#   - The project already has code to compute homography-aligned overlap PSNR.
#   - Sharp reference images are not captured from exactly the same viewpoint.
#   - The experiment target is panning-shot motion blur, not generic defocus blur.
#   - sudo is not required and is disabled.
#
# Main instruction to Codex/agent:
#   Be autonomous inside this repo: clone public repos, download public weights,
#   create isolated environments, run inference, collect outputs, and update logs.
#   Do not use sudo. Do not delete existing project files without making a backup
#   or git checkpoint.

schema_version: 0.2
project: panning
benchmark_name: panning_deblur_known_kernel_vs_blind
created_for: panning-shot deblurring evaluation

paths:
  project_root: "."
  data_root: "data"
  input_blurry_dir: "data/panning/blurry"
  sharp_reference_dir: "data/panning/sharp_ref"
  pair_manifest: "data/panning/pairs.yaml"
  kernel_dir: "data/panning/kernels"
  third_party_dir: "third_party"
  checkpoint_dir: "checkpoints"
  output_root: "outputs/deblurring"
  report_dir: "reports/deblurring"
  log_dir: "logs/deblurring"
  cache_dir: ".cache/deblurring"

permissions:
  sudo: false
  allow_git_clone: true
  allow_git_pull_in_third_party: true
  allow_public_weight_download: true
  allow_dataset_download: false
  allow_conda_env_create: true
  allow_pip_install: true
  allow_edit_project_code: true
  allow_edit_third_party_code: true
  allow_create_wrappers: true
  allow_run_gpu_inference: true
  allow_run_cpu_fallback: true
  allow_generate_reports: true
  allow_write_outputs: true
  allow_write_logs: true
  allow_delete_outputs_only: true
  allow_delete_checkpoints: false
  allow_delete_data: false
  allow_network_access:
    purpose:
      - "git clone public repositories"
      - "download public pretrained weights"
      - "download small dependency metadata"
    forbidden:
      - "upload private images or results"
      - "send data to external APIs"
      - "download unrelated datasets without explicit approval"

safety_and_reproducibility:
  require_git_checkpoint_before_code_changes: true
  backup_before_overwrite: true
  never_commit_large_files: true
  large_file_patterns:
    - "*.pth"
    - "*.pt"
    - "*.ckpt"
    - "*.safetensors"
    - "*.onnx"
    - "*.npz"
    - "*.npy"
    - "*.png"
    - "*.jpg"
    - "*.jpeg"
    - "*.tif"
    - "*.tiff"
    - "*.mp4"
    - "*.mov"
  update_gitignore: true
  gitignore_entries:
    - "third_party/"
    - "checkpoints/"
    - "outputs/"
    - "reports/deblurring/contact_sheets/"
    - "logs/deblurring/"
    - ".cache/deblurring/"
    - "data/"
    - "*.pth"
    - "*.pt"
    - "*.ckpt"
    - "*.safetensors"
  log_every_command: true
  command_log: "logs/deblurring/commands.log"
  failure_log: "logs/deblurring/failures.md"
  environment_log: "logs/deblurring/environments.md"
  results_table: "reports/deblurring/results.csv"

data_contract:
  pair_manifest_format:
    description: "Each blurry panning shot is paired with one or more nearby-view sharp references."
    example:
      - pair_id: "scene001_frame003"
        blurry: "data/panning/blurry/scene001_frame003.png"
        sharp_refs:
          - "data/panning/sharp_ref/scene001_frame002.png"
          - "data/panning/sharp_ref/scene001_frame004.png"
        known_kernels:
          global_kernel: "data/panning/kernels/scene001_frame003_kernel.npy"
          spatial_kernel_field: null
        metadata:
          camera_motion: "horizontal_panning"
          exposure_time: null
          focal_length: null
          notes: null
  kernel_formats:
    global_kernel:
      extensions:
        - ".npy"
        - ".npz"
        - ".png"
        - ".mat"
      expected_shape: "[kh, kw] or [1, kh, kw]"
      normalize_sum_to_one: true
    spatial_kernel_field:
      extensions:
        - ".npz"
        - ".npy"
      expected_shape: "[H, W, kh, kw] or compressed basis representation"
      normalize_per_pixel_sum_to_one: true
  image_formats:
    input:
      - ".png"
      - ".jpg"
      - ".jpeg"
      - ".tif"
      - ".tiff"
    output: ".png"

evaluation:
  primary_metric: "homography_overlap_psnr"
  primary_metric_description: >
    Use the existing project code to estimate homography between restored image
    and sharp reference, warp the reference or restored image according to the
    established project convention, compute overlap mask, and report PSNR only
    on valid overlapping pixels.
  existing_eval_entrypoint:
    status: "already_available_in_project"
    command_template: >
      python tools/eval_homography_psnr.py
      --restored {restored}
      --sharp_ref {sharp_ref}
      --out_json {out_json}
      --out_vis {out_vis}
    notes:
      - "If the actual script path/name differs, Codex should locate it and update this field."
      - "Do not replace the existing evaluator unless it is broken."
  metrics:
    required:
      - homography_overlap_psnr
      - overlap_ratio
      - homography_inlier_count
      - homography_inlier_ratio
    recommended:
      - homography_overlap_ssim
      - lpips_on_overlap
      - edge_sharpness
      - ringing_penalty
      - saturation_ratio
      - runtime_seconds
      - gpu_memory_mb
    optional_no_reference:
      - niqe
      - brisque
      - clip_iqa
  ranking:
    main_sort:
      - metric: homography_overlap_psnr
        order: descending
      - metric: overlap_ratio
        order: descending
      - metric: ringing_penalty
        order: ascending
    minimum_valid_overlap_ratio: 0.25
    reject_if_homography_fails: true
    compare_against:
      - blurry_input
      - simple_unsharp_mask
      - known_kernel_wiener_if_kernel_available
  outputs:
    per_pair_json: "reports/deblurring/per_pair/{method_id}/{pair_id}.json"
    aggregate_csv: "reports/deblurring/results.csv"
    leaderboard_csv: "reports/deblurring/leaderboard.csv"
    contact_sheet_dir: "reports/deblurring/contact_sheets"
    qualitative_html: "reports/deblurring/index.html"

experiment_groups:
  - id: known_kernel
    name: Known-kernel / non-blind deblurring
    description: >
      Use panning blur kernels supplied by the project, estimated from metadata,
      synthetic panning model, or manually provided kernel files. These methods
      should not infer the kernel from the blurry image unless explicitly marked
      as oracle_or_estimated_kernel.
    run_if:
      kernel_available: true
    expected_use:
      - "Validate whether the known panning kernel is sufficient."
      - "Separate kernel quality from deconvolution quality."
      - "Provide interpretable physics-based baselines."
    candidates:
      - skimage_richardson_lucy
      - scipy_wiener
      - custom_fft_wiener
      - custom_tv_deconvolution
      - custom_half_quadratic_deconv
      - j_mkpd_nonblind_component_if_extractable

  - id: blind
    name: Blind deblurring
    description: >
      Methods receive only the blurry panning image. Some explicitly estimate
      kernels; others are end-to-end learned restoration models trained on
      generic deblurring data.
    run_if:
      kernel_available: false_or_true
    expected_use:
      - "Check whether public baselines generalize to panning-shot blur."
      - "Compare explicit kernel-estimation methods against end-to-end models."
      - "Identify models worth fine-tuning later."
    candidates:
      - nafnet
      - restormer
      - fftformer
      - mimo_unet
      - deep_rft
      - j_mkpd
      - selfdeblur
      - phase_only_kernel_estimation
      - deblurgan_v2_optional

candidate_methods:
  # ---------------------------------------------------------------------------
  # Known-kernel / non-blind baselines.
  # These should be implemented locally first. They do not need external repos.
  # ---------------------------------------------------------------------------

  - id: blurry_input
    group: diagnostic
    name: Blurry input baseline
    type: identity
    priority: 0
    implementation: local
    command_template: >
      python tools/copy_baseline.py
      --input {blurry}
      --output {output}
    status: must_have
    notes:
      - "Always include this so PSNR gain over input is explicit."

  - id: simple_unsharp_mask
    group: diagnostic
    name: Simple unsharp mask
    type: local_filter
    priority: 1
    implementation: local
    command_template: >
      python baselines/unsharp_mask.py
      --input {blurry}
      --output {output}
      --radius {radius}
      --amount {amount}
    sweep:
      radius: [1.0, 2.0, 3.0]
      amount: [0.5, 1.0, 1.5]
    status: implement_first
    notes:
      - "Not a deblurring method, but useful to detect whether metrics reward naive sharpening."

  - id: scipy_wiener
    group: known_kernel
    name: Wiener deconvolution
    type: nonblind_deconvolution
    priority: 2
    implementation: local
    dependencies:
      pip:
        - numpy
        - scipy
        - scikit-image
        - opencv-python
    command_template: >
      python baselines/known_kernel/wiener.py
      --input {blurry}
      --kernel {kernel}
      --output {output}
      --balance {balance}
      --clip
    sweep:
      balance: [0.001, 0.003, 0.01, 0.03, 0.1]
    status: implement_first
    notes:
      - "Fast first known-kernel baseline."
      - "Use normalized kernel; pad carefully to avoid circular artifacts."

  - id: skimage_richardson_lucy
    group: known_kernel
    name: Richardson-Lucy deconvolution
    type: nonblind_deconvolution
    priority: 3
    implementation: local
    dependencies:
      pip:
        - numpy
        - scipy
        - scikit-image
        - opencv-python
    command_template: >
      python baselines/known_kernel/richardson_lucy.py
      --input {blurry}
      --kernel {kernel}
      --output {output}
      --iterations {iterations}
      --clip
    sweep:
      iterations: [5, 10, 20, 40]
    status: implement_first
    notes:
      - "Can sharpen strongly but may amplify noise/ringing."
      - "Evaluate ringing penalty alongside PSNR."

  - id: custom_fft_wiener
    group: known_kernel
    name: Custom FFT Wiener deconvolution
    type: nonblind_deconvolution
    priority: 4
    implementation: local
    command_template: >
      python baselines/known_kernel/fft_wiener.py
      --input {blurry}
      --kernel {kernel}
      --output {output}
      --lambda_reg {lambda_reg}
      --edgetaper {edgetaper}
    sweep:
      lambda_reg: [0.0003, 0.001, 0.003, 0.01, 0.03]
      edgetaper: [true, false]
    status: implement_first
    notes:
      - "Keep this because panning blur may be well modeled by a global linear kernel."
      - "Should support grayscale kernel applied to RGB channels."

  - id: custom_tv_deconvolution
    group: known_kernel
    name: TV-regularized non-blind deconvolution
    type: nonblind_deconvolution
    priority: 5
    implementation: local
    command_template: >
      python baselines/known_kernel/tv_deconvolution.py
      --input {blurry}
      --kernel {kernel}
      --output {output}
      --lambda_tv {lambda_tv}
      --iterations {iterations}
    sweep:
      lambda_tv: [0.0005, 0.001, 0.003, 0.01]
      iterations: [50, 100, 200]
    status: implement_next
    notes:
      - "Slower but often less ringy than plain inverse/Wiener."
      - "Good known-kernel baseline if panning kernel is reliable."

  - id: custom_half_quadratic_deconv
    group: known_kernel
    name: Half-quadratic non-blind deconvolution
    type: nonblind_deconvolution
    priority: 6
    implementation: local
    command_template: >
      python baselines/known_kernel/hq_deconvolution.py
      --input {blurry}
      --kernel {kernel}
      --output {output}
      --lambda_reg {lambda_reg}
      --iterations {iterations}
    sweep:
      lambda_reg: [0.001, 0.003, 0.01, 0.03]
      iterations: [20, 50, 100]
    status: optional
    notes:
      - "Useful if Wiener/RL are too noisy."
      - "Can be added after first benchmark loop works."

  # ---------------------------------------------------------------------------
  # Blind / learned deblurring baselines.
  # These get only the blurry image at inference time.
  # ---------------------------------------------------------------------------

  - id: nafnet
    group: blind
    name: NAFNet
    type: end_to_end_deblurring
    priority: 10
    implementation: external_repo
    repo_url: "https://github.com/megvii-research/NAFNet"
    official_repo: true
    code_available: true
    expected_weights: "GoPro/REDS deblurring pretrained weights; verify README links"
    clone_dir: "third_party/NAFNet"
    env:
      name: "panning-nafnet"
      python: "3.9"
      install:
        - "pip install -r third_party/NAFNet/requirements.txt"
        - "cd third_party/NAFNet && python setup.py develop --no_cuda_ext"
    wrapper:
      path: "wrappers/nafnet.py"
      command_template: >
        python wrappers/nafnet.py
        --input {blurry}
        --output {output}
        --weights {weights}
        --device {device}
    status: integrate_first
    notes:
      - "Strong fast generic blind baseline."
      - "May not match panning-specific blur distribution."

  - id: restormer
    group: blind
    name: Restormer
    type: end_to_end_deblurring
    priority: 11
    implementation: external_repo
    repo_url: "https://github.com/swz30/Restormer"
    official_repo: true
    code_available: true
    expected_weights: "Motion deblurring and/or defocus deblurring checkpoints; verify README links"
    clone_dir: "third_party/Restormer"
    env:
      name: "panning-restormer"
      python: "3.8"
      install:
        - "pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118"
        - "pip install numpy opencv-python scipy scikit-image einops"
    wrapper:
      path: "wrappers/restormer.py"
      command_template: >
        python wrappers/restormer.py
        --input {blurry}
        --output {output}
        --weights {weights}
        --device {device}
        --tile {tile}
    status: integrate_first
    notes:
      - "Good high-resolution image restoration baseline."
      - "Use tiling if memory is insufficient."

  - id: fftformer
    group: blind
    name: FFTformer
    type: end_to_end_deblurring
    priority: 12
    implementation: external_repo
    repo_url: "https://github.com/kkkls/FFTformer"
    official_repo: true
    code_available: true
    expected_weights: "GoPro/HIDE/RealBlur weights if provided by repo"
    clone_dir: "third_party/FFTformer"
    env:
      name: "panning-fftformer"
      python: "3.9"
      install:
        - "pip install numpy opencv-python scipy scikit-image einops timm"
    wrapper:
      path: "wrappers/fftformer.py"
      command_template: >
        python wrappers/fftformer.py
        --input {blurry}
        --output {output}
        --weights {weights}
        --device {device}
    status: integrate_first
    notes:
      - "Frequency-domain transformer; likely useful for motion blur."

  - id: mimo_unet
    group: blind
    name: MIMO-UNet
    type: end_to_end_deblurring
    priority: 13
    implementation: external_repo
    repo_url: "https://github.com/chosj95/MIMO-UNet"
    official_repo: true
    code_available: true
    expected_weights: "GoPro pretrained model; verify README links"
    clone_dir: "third_party/MIMO-UNet"
    env:
      name: "panning-mimo"
      python: "3.8"
      install:
        - "pip install -r third_party/MIMO-UNet/requirements.txt"
    wrapper:
      path: "wrappers/mimo_unet.py"
      command_template: >
        python wrappers/mimo_unet.py
        --input {blurry}
        --output {output}
        --weights {weights}
        --device {device}
    status: integrate_next
    notes:
      - "Older but standard blind motion deblurring baseline."

  - id: deep_rft
    group: blind
    name: DeepRFT
    type: end_to_end_deblurring
    priority: 14
    implementation: external_repo
    repo_url: "https://github.com/INVOKERer/DeepRFT"
    official_repo: true
    code_available: true
    expected_weights: "Deblur pretrained model available via repo instructions"
    clone_dir: "third_party/DeepRFT"
    env:
      name: "panning-deeprft"
      python: "3.8"
      install:
        - "pip install numpy opencv-python scipy scikit-image einops"
    wrapper:
      path: "wrappers/deep_rft.py"
      command_template: >
        python wrappers/deep_rft.py
        --input {blurry}
        --output {output}
        --weights {weights}
        --device {device}
    status: integrate_next
    notes:
      - "Good additional deblurring baseline."
      - "Repo provides own test command; wrapper should call or adapt it."

  - id: j_mkpd
    group: blind
    name: J-MKPD
    type: explicit_kernel_estimation_plus_nonblind_deconvolution
    priority: 15
    implementation: external_repo
    repo_url: "https://github.com/GuillermoCarbajal/J-MKPD"
    official_repo: true
    code_available: true
    expected_weights: "Trained models should be available according to paper/repo; verify"
    clone_dir: "third_party/J-MKPD"
    env:
      name: "panning-jmkpd"
      python: "3.9"
      install:
        - "pip install numpy opencv-python scipy scikit-image einops"
    wrapper:
      path: "wrappers/j_mkpd.py"
      command_template: >
        python wrappers/j_mkpd.py
        --input {blurry}
        --output {output}
        --device {device}
    extra_outputs:
      - "estimated_kernel_or_kernel_field"
    status: integrate_next
    notes:
      - "Important for panning: estimates pixel-wise motion kernels, then deconvolves."
      - "If possible, save estimated kernels for comparison with known panning kernels."

  - id: selfdeblur
    group: blind
    name: SelfDeblur
    type: per_image_optimization_blind_deconvolution
    priority: 16
    implementation: external_repo
    repo_url: "https://github.com/csdwren/SelfDeblur"
    official_repo: true
    code_available: true
    expected_weights: "May not require pretrained weights; verify"
    clone_dir: "third_party/SelfDeblur"
    env:
      name: "panning-selfdeblur"
      python: "3.8"
      install:
        - "pip install numpy opencv-python scipy scikit-image matplotlib"
    wrapper:
      path: "wrappers/selfdeblur.py"
      command_template: >
        python wrappers/selfdeblur.py
        --input {blurry}
        --output {output}
        --device {device}
        --iterations {iterations}
    sweep:
      iterations: [1000, 2000, 5000]
    status: optional_slow
    notes:
      - "Per-image optimization can be slow."
      - "Useful for checking whether explicit blind deconvolution can adapt to panning shots."

  - id: phase_only_kernel_estimation
    group: blind
    name: Phase-only image-based kernel estimation
    type: blind_kernel_estimation_plus_nonblind_deconvolution
    priority: 17
    implementation: external_repo
    repo_url: "https://github.com/panpanfei/Phase-only-Image-Based-Kernel-Estimation-for-Blind-Motion-Deblurring"
    official_repo: true
    code_available: true
    expected_weights: "Classical method; likely no neural weights"
    clone_dir: "third_party/phase_only_kernel_estimation"
    env:
      name: "panning-phaseonly"
      python: "3.8"
      install:
        - "pip install numpy opencv-python scipy scikit-image matplotlib"
    wrapper:
      path: "wrappers/phase_only.py"
      command_template: >
        python wrappers/phase_only.py
        --input {blurry}
        --output {output}
        --kernel_output {kernel_output}
    extra_outputs:
      - "estimated_global_kernel"
    status: optional
    notes:
      - "Relevant because panning blur may be close to directional motion blur."
      - "Use estimated kernel with the same known-kernel deconvolution backends where possible."

  - id: deblurgan_v2_optional
    group: blind
    name: DeblurGAN-v2 or DeblurGAN
    type: gan_deblurring
    priority: 18
    implementation: external_repo
    repo_url: "https://github.com/VITA-Group/DeblurGANv2"
    fallback_repo_url: "https://github.com/KupynOrest/DeblurGAN"
    official_repo: "verify"
    code_available: true
    expected_weights: "Verify available pretrained models"
    clone_dir: "third_party/DeblurGANv2"
    env:
      name: "panning-deblurgan"
      python: "3.8"
    wrapper:
      path: "wrappers/deblurgan.py"
      command_template: >
        python wrappers/deblurgan.py
        --input {blurry}
        --output {output}
        --weights {weights}
        --device {device}
    status: optional
    notes:
      - "GAN methods can look sharp but may hallucinate."
      - "Use only as perceptual comparison, not primary scientific baseline."

runner:
  device: "cuda"
  cpu_fallback: true
  precision:
    allow_amp: true
    default: "fp32"
  max_image_side: null
  tile:
    enabled_if_needed: true
    default_tile_size: 512
    default_overlap: 64
  test_time_augmentation:
    enabled: false
    options:
      - none
      - hflip
      - vflip
      - x8
  sweeps:
    known_kernel:
      enabled: true
      max_trials_per_pair_per_method: 30
    blind:
      enabled: true
      max_trials_per_pair_per_method: 5
  execution_order:
    - blurry_input
    - simple_unsharp_mask
    - scipy_wiener
    - skimage_richardson_lucy
    - custom_fft_wiener
    - nafnet
    - restormer
    - fftformer
    - mimo_unet
    - deep_rft
    - j_mkpd
    - phase_only_kernel_estimation
    - selfdeblur
  stop_conditions:
    stop_method_if_all_pairs_fail: true
    stop_trial_if_output_invalid: true
    skip_if_output_exists: true

reporting:
  group_by:
    - experiment_group
    - method_id
    - pair_id
  save_best_per_pair: true
  save_best_per_method: true
  generate_contact_sheets: true
  contact_sheet_fields:
    - blurry_input
    - restored
    - warped_sharp_ref
    - overlap_mask
    - residual_on_overlap
  plots:
    - psnr_by_method
    - psnr_gain_over_blurry
    - runtime_vs_psnr
    - overlap_ratio_histogram
  markdown_summary: "reports/deblurring/summary.md"

codex_task_plan:
  - id: locate_existing_eval
    priority: 0
    instruction: >
      Search the panning repo for the existing homography/warp/overlap PSNR evaluator.
      Update evaluation.existing_eval_entrypoint.command_template if needed.
      Do not rewrite it unless it fails on a simple restored/reference pair.
  - id: validate_manifest
    priority: 1
    instruction: >
      Validate data/panning/pairs.yaml. Confirm every blurry image and sharp reference exists.
      Confirm known kernel files exist where declared. Write a manifest report.
  - id: implement_local_known_kernel_baselines
    priority: 2
    instruction: >
      Implement blurry_input, simple_unsharp_mask, scipy_wiener, skimage_richardson_lucy,
      and custom_fft_wiener under baselines/. Run smoke tests on one pair.
  - id: clone_and_wrap_first_blind_baselines
    priority: 3
    instruction: >
      Clone NAFNet, Restormer, FFTformer, and MIMO-UNet into third_party/.
      Download public pretrained weights into checkpoints/.
      Implement wrappers with a uniform CLI. Run smoke tests on one image.
  - id: run_phase_1_benchmark
    priority: 4
    instruction: >
      Run all implemented known-kernel and first blind baselines on all manifest pairs.
      Evaluate with homography_overlap_psnr. Generate results.csv and contact sheets.
  - id: add_kernel_estimation_methods
    priority: 5
    instruction: >
      Integrate J-MKPD and phase-only kernel estimation if setup succeeds.
      Save estimated kernels and compare them qualitatively/quantitatively with known kernels.
  - id: summarize_findings
